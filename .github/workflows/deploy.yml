name: GitHub Pages へ公開

# main を更新しても公開しない。公開するときは管理者が Actions の画面から手動で実行する。
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: 公開するコミット
        env:
          DEPLOY_SHA: ${{ github.sha }}
          DEPLOY_REF: ${{ github.ref }}
          DEPLOY_ACTOR: ${{ github.actor }}
        run: |
          echo "Deploy commit: $DEPLOY_SHA"
          echo "Deploy ref: $DEPLOY_REF"
          {
            echo "### GitHub Pages へ公開するコミット"
            echo ""
            echo "- commit: \`$DEPLOY_SHA\`"
            echo "- ref: \`$DEPLOY_REF\`"
            echo "- 実行者: $DEPLOY_ACTOR"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: dist

  deploy:
    needs: build
    permissions:
      contents: read
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
